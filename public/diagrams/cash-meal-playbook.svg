<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">餐餐摇现金主页面玩法架构树状图</title>
  <desc id="desc">以餐餐摇现金主页面为根节点，向下拆解玩法主对象、奖励模块、行动模块、进度模块、牵引模块和辅助模块。</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .bg { fill: #fbfcfe; }
      .canvas { fill: #ffffff; stroke: #d7dce3; stroke-width: 3; filter: url(#softShadow); }
      .title { font: 700 44px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 21px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #64748b; }
      .rootText { font: 700 28px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .nodeTitle { font: 700 20px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .leafText { font: 400 16px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #334155; }
      .hint { font: 400 15px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #64748b; }
      .root { fill: #f7fbff; stroke: #111827; stroke-width: 2.6; }
      .nodeGreen { fill: #e4f8e9; stroke: #79c99c; stroke-width: 2; }
      .nodeBlue { fill: #dff0ff; stroke: #8fcfff; stroke-width: 2; }
      .nodePurple { fill: #f0e5ff; stroke: #c38cff; stroke-width: 2; }
      .nodeYellow { fill: #fff2d8; stroke: #ffc864; stroke-width: 2; }
      .nodeMint { fill: #def7f0; stroke: #70d2bd; stroke-width: 2; }
      .nodeGray { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .leaf { fill: rgba(255,255,255,0.68); stroke: #94a3b8; stroke-width: 1.6; }
      .line { stroke: #94a3b8; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .lineDark { stroke: #64748b; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <rect class="canvas" x="70" y="70" width="1460" height="760" rx="30"/>

  <text class="title" x="130" y="146">餐餐摇现金主页面玩法架构图</text>
  <text class="subtitle" x="130" y="184">用树状结构拆解主页面：先看根节点，再看模块分类，最后看页面承载内容。</text>

  <!-- Root -->
  <rect class="root" x="610" y="235" width="380" height="92" rx="24"/>
  <text class="rootText" x="682" y="274">餐餐摇现金主页面</text>
  <text class="hint" x="704" y="303">饭点进入，摇一摇领现金</text>

  <!-- Trunk line -->
  <path class="lineDark" d="M800 327 V380"/>
  <path class="lineDark" d="M230 380 H1370"/>

  <!-- Level 1 nodes -->
  <g>
    <path class="line" d="M230 380 V420"/>
    <rect class="nodeGreen" x="110" y="420" width="240" height="76" rx="18"/>
    <text class="nodeTitle" x="154" y="452">玩法主对象</text>
    <text class="hint" x="172" y="476">建立核心认知</text>
  </g>

  <g>
    <path class="line" d="M420 380 V420"/>
    <rect class="nodeBlue" x="300" y="420" width="240" height="76" rx="18"/>
    <text class="nodeTitle" x="372" y="452">奖励模块</text>
    <text class="hint" x="358" y="476">让用户觉得值得摇</text>
  </g>

  <g>
    <path class="line" d="M610 380 V420"/>
    <rect class="nodeYellow" x="490" y="420" width="240" height="76" rx="18"/>
    <text class="nodeTitle" x="562" y="452">行动模块</text>
    <text class="hint" x="552" y="476">承接点击行为</text>
  </g>

  <g>
    <path class="line" d="M800 380 V420"/>
    <rect class="nodePurple" x="680" y="420" width="240" height="76" rx="18"/>
    <text class="nodeTitle" x="752" y="452">进度模块</text>
    <text class="hint" x="734" y="476">制造参与推进感</text>
  </g>

  <g>
    <path class="line" d="M1030 380 V420"/>
    <rect class="nodeMint" x="910" y="420" width="240" height="76" rx="18"/>
    <text class="nodeTitle" x="982" y="452">牵引模块</text>
    <text class="hint" x="958" y="476">给出现在/下次理由</text>
  </g>

  <g>
    <path class="line" d="M1370 380 V420"/>
    <rect class="nodeGray" x="1250" y="420" width="240" height="76" rx="18"/>
    <text class="nodeTitle" x="1322" y="452">辅助模块</text>
    <text class="hint" x="1298" y="476">补充说明和氛围</text>
  </g>

  <!-- Leaves: main object -->
  <g>
    <path class="line" d="M230 496 V535"/>
    <rect class="leaf" x="132" y="535" width="196" height="58" rx="14"/>
    <text class="leafText" x="204" y="570">摇钱树</text>
  </g>

  <!-- Leaves: reward -->
  <g>
    <path class="line" d="M420 496 V520"/>
    <path class="line" d="M340 520 H500"/>
    <path class="line" d="M340 520 V535"/>
    <path class="line" d="M420 520 V535"/>
    <path class="line" d="M500 520 V535"/>
    <rect class="leaf" x="294" y="535" width="92" height="58" rx="14"/>
    <text class="leafText" x="310" y="570">现金红包</text>
    <rect class="leaf" x="394" y="535" width="92" height="58" rx="14"/>
    <text class="leafText" x="418" y="570">直接打款</text>
    <rect class="leaf" x="494" y="535" width="92" height="58" rx="14"/>
    <text class="leafText" x="516" y="570">霸王券</text>
  </g>

  <!-- Leaves: action -->
  <g>
    <path class="line" d="M610 496 V535"/>
    <rect class="leaf" x="512" y="535" width="196" height="58" rx="14"/>
    <text class="leafText" x="552" y="570">摇一摇 领现金</text>
  </g>

  <!-- Leaves: progress -->
  <g>
    <path class="line" d="M800 496 V520"/>
    <path class="line" d="M745 520 H855"/>
    <path class="line" d="M745 520 V535"/>
    <path class="line" d="M855 520 V535"/>
    <rect class="leaf" x="688" y="535" width="114" height="58" rx="14"/>
    <text class="leafText" x="708" y="570">摇一摇人数</text>
    <rect class="leaf" x="812" y="535" width="126" height="58" rx="14"/>
    <text class="leafText" x="830" y="570">解锁大奖进度</text>
  </g>

  <!-- Leaves: pull -->
  <g>
    <path class="line" d="M1030 496 V520"/>
    <path class="line" d="M940 520 H1120"/>
    <path class="line" d="M940 520 V535"/>
    <path class="line" d="M1030 520 V535"/>
    <path class="line" d="M1120 520 V535"/>
    <rect class="leaf" x="882" y="535" width="116" height="58" rx="14"/>
    <text class="leafText" x="912" y="570">饭点场次</text>
    <rect class="leaf" x="1010" y="535" width="92" height="58" rx="14"/>
    <text class="leafText" x="1030" y="570">倒计时</text>
    <rect class="leaf" x="1114" y="535" width="116" height="58" rx="14"/>
    <text class="leafText" x="1144" y="570">参与动态</text>
  </g>

  <!-- Leaves: auxiliary -->
  <g>
    <path class="line" d="M1370 496 V520"/>
    <path class="line" d="M1268 520 H1472"/>
    <path class="line" d="M1268 520 V535"/>
    <path class="line" d="M1336 520 V535"/>
    <path class="line" d="M1404 520 V535"/>
    <path class="line" d="M1472 520 V535"/>
    <rect class="leaf" x="1224" y="535" width="88" height="58" rx="14"/>
    <text class="leafText" x="1240" y="570">摇树攻略</text>
    <rect class="leaf" x="1320" y="535" width="88" height="58" rx="14"/>
    <text class="leafText" x="1336" y="570">中奖名单</text>
    <rect class="leaf" x="1416" y="535" width="70" height="58" rx="14"/>
    <text class="leafText" x="1432" y="570">弹幕</text>
    <rect class="leaf" x="1494" y="535" width="84" height="58" rx="14"/>
    <text class="leafText" x="1510" y="570">好友动态</text>
  </g>

  <!-- Footer note -->
  <rect class="nodeGray" x="130" y="685" width="1340" height="72" rx="20"/>
  <text class="hint" x="168" y="727">说明：这张图只表达主页面承载的玩法模块，不包含完整活动链路、弹窗流程、发奖规则和异常状态。</text>
</svg>
