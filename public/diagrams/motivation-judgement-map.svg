<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">用户动机判断维度思维导图</title>
  <desc id="desc">以用户动机判断维度为中心，展开增长目标、用户特征和可用资源三个判断维度。</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .bg { fill: #fbfcfe; }
      .canvas { fill: #ffffff; stroke: #d7dce3; stroke-width: 3; filter: url(#softShadow); }
      .title { font: 700 44px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 21px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #64748b; }
      .centerText { font: 700 30px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .centerSub { font: 400 17px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #64748b; }
      .branchTitle { font: 700 25px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .nodeTitle { font: 700 18px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .nodeText { font: 400 16px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #334155; }
      .hint { font: 400 15px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #64748b; }
      .center { fill: #f7fbff; stroke: #111827; stroke-width: 2.5; }
      .green { fill: #e4f8e9; stroke: #79c99c; stroke-width: 2; }
      .blue { fill: #dff0ff; stroke: #8fcfff; stroke-width: 2; }
      .purple { fill: #f0e5ff; stroke: #c38cff; stroke-width: 2; }
      .leaf { fill: rgba(255,255,255,0.68); stroke: #cbd5e1; stroke-width: 1.7; }
      .line { stroke: #94a3b8; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .lineGreen { stroke: #79c99c; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .lineBlue { stroke: #8fcfff; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .linePurple { stroke: #c38cff; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <rect class="canvas" x="70" y="70" width="1460" height="760" rx="30"/>

  <text class="title" x="130" y="146">用户动机判断维度</text>
  <text class="subtitle" x="130" y="184">用三个维度判断：业务要什么、用户是谁、我们能用什么撬动。</text>

  <!-- Center -->
  <rect class="center" x="610" y="365" width="380" height="128" rx="30"/>
  <text class="centerText" x="664" y="420">用户动机判断维度</text>
  <text class="centerSub" x="682" y="456">动机是假设，需要被后续玩法验证</text>

  <!-- Branch connectors -->
  <path class="lineGreen" d="M610 420 C520 382 470 314 430 258"/>
  <path class="lineBlue" d="M800 365 C800 314 800 278 800 232"/>
  <path class="linePurple" d="M990 420 C1080 382 1130 314 1170 258"/>

  <!-- Branch 1: Growth target -->
  <g transform="translate(130 225)">
    <rect class="green" x="0" y="0" width="360" height="92" rx="22"/>
    <text class="branchTitle" x="112" y="38">增长目标</text>
    <text class="hint" x="48" y="66">业务希望在什么周期内，推动什么行为？</text>

    <path class="lineGreen" d="M180 92 V126"/>
    <path class="lineGreen" d="M70 126 H290"/>
    <path class="lineGreen" d="M70 126 V152"/>
    <path class="lineGreen" d="M290 126 V152"/>

    <rect class="leaf" x="-10" y="152" width="160" height="104" rx="16"/>
    <text class="nodeTitle" x="34" y="188">目标周期</text>
    <text class="nodeText" x="24" y="218">短期爆发</text>
    <text class="nodeText" x="24" y="244">长期留存</text>

    <rect class="leaf" x="210" y="152" width="180" height="132" rx="16"/>
    <text class="nodeTitle" x="252" y="188">行为难度</text>
    <text class="nodeText" x="232" y="218">轻动作</text>
    <text class="nodeText" x="232" y="244">持续动作</text>
    <text class="nodeText" x="232" y="270">高决策 / 社交动作</text>
  </g>

  <!-- Branch 2: User features -->
  <g transform="translate(620 150)">
    <rect class="blue" x="0" y="0" width="360" height="92" rx="22"/>
    <text class="branchTitle" x="128" y="38">用户特征</text>
    <text class="hint" x="66" y="66">要激励的是谁？容易被什么打动？</text>

    <path class="lineBlue" d="M180 92 V126"/>
    <path class="lineBlue" d="M48 126 H312"/>
    <path class="lineBlue" d="M48 126 V152"/>
    <path class="lineBlue" d="M180 126 V152"/>
    <path class="lineBlue" d="M312 126 V152"/>

    <rect class="leaf" x="-28" y="152" width="152" height="132" rx="16"/>
    <text class="nodeTitle" x="20" y="188">生命周期</text>
    <text class="nodeText" x="10" y="218">新用户</text>
    <text class="nodeText" x="10" y="244">老用户</text>
    <text class="nodeText" x="10" y="270">沉默用户</text>

    <rect class="leaf" x="142" y="152" width="152" height="104" rx="16"/>
    <text class="nodeTitle" x="174" y="188">用户价值</text>
    <text class="nodeText" x="166" y="218">高价值用户</text>
    <text class="nodeText" x="166" y="244">低活用户</text>

    <rect class="leaf" x="312" y="152" width="176" height="132" rx="16"/>
    <text class="nodeTitle" x="350" y="188">用户偏好</text>
    <text class="nodeText" x="334" y="218">周边奖品</text>
    <text class="nodeText" x="334" y="244">收藏 / 身份</text>
    <text class="nodeText" x="334" y="270">社交表达</text>
  </g>

  <!-- Branch 3: Available resources -->
  <g transform="translate(1110 225)">
    <rect class="purple" x="0" y="0" width="360" height="92" rx="22"/>
    <text class="branchTitle" x="128" y="38">可用资源</text>
    <text class="hint" x="60" y="66">我们手里有什么筹码可以承接动机？</text>

    <path class="linePurple" d="M180 92 V126"/>
    <path class="linePurple" d="M48 126 H312"/>
    <path class="linePurple" d="M48 126 V152"/>
    <path class="linePurple" d="M180 126 V152"/>
    <path class="linePurple" d="M312 126 V152"/>

    <rect class="leaf" x="-34" y="152" width="160" height="132" rx="16"/>
    <text class="nodeTitle" x="12" y="188">激励预算</text>
    <text class="nodeText" x="-8" y="218">高预算：现金券</text>
    <text class="nodeText" x="-8" y="244">低预算：权益</text>
    <text class="nodeText" x="-8" y="270">零边际：身份</text>

    <rect class="leaf" x="142" y="152" width="160" height="132" rx="16"/>
    <text class="nodeTitle" x="182" y="188">奖品类型</text>
    <text class="nodeText" x="164" y="218">现金 / 实物</text>
    <text class="nodeText" x="164" y="244">平台权益</text>
    <text class="nodeText" x="164" y="270">虚拟荣誉</text>

    <rect class="leaf" x="318" y="152" width="166" height="132" rx="16"/>
    <text class="nodeTitle" x="352" y="188">产品心智</text>
    <text class="nodeText" x="340" y="218">电商：省钱</text>
    <text class="nodeText" x="340" y="244">学习：成长</text>
    <text class="nodeText" x="340" y="270">公益：意义感</text>
  </g>

  <!-- Bottom examples -->
  <rect class="leaf" x="210" y="720" width="1180" height="58" rx="18"/>
  <text class="hint" x="250" y="756">示例：大促拉新可偏收益/稀缺；连续打卡可偏进度/养成；高价值用户可偏身份/特权；00 后用户可偏联名周边和社交表达。</text>
</svg>
